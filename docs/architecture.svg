<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15251f"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#f1f4ec"/>

  <!-- Title -->
  <text x="30" y="36" font-size="22" font-weight="800" fill="#15251f">CheckIfYouFit — System Architecture</text>
  <text x="30" y="58" font-size="13" fill="#4f645a">Next.js 16 (App Router) + React 19 · fully static / client-side · no backend, no API routes, no database</text>

  <!-- ================= CLIENT PANEL ================= -->
  <rect x="30" y="85" width="600" height="640" rx="14" fill="#e7efe4" stroke="#15251f" stroke-width="2"/>
  <rect x="30" y="85" width="600" height="46" rx="14" fill="#0e4a3c"/>
  <rect x="30" y="115" width="600" height="16" fill="#0e4a3c"/>
  <text x="50" y="114" font-size="15" font-weight="800" fill="#fcfdf7">Client — User's web browser</text>
  <text x="610" y="114" font-size="11.5" fill="#c9dcd0" text-anchor="end">static prerender → hydration</text>

  <!-- Routes column -->
  <rect x="52" y="160" width="178" height="330" rx="10" fill="#fcfdf7" stroke="#15251f" stroke-width="1.8"/>
  <text x="141" y="184" font-size="13" font-weight="800" fill="#15251f" text-anchor="middle">Routes — app/</text>
  <line x1="66" y1="194" x2="216" y2="194" stroke="#c9d6c9" stroke-width="1"/>
  <g font-size="11.5" fill="#15251f">
    <text x="66" y="216">/  (home + wizard)</text>
    <text x="66" y="238">/destinations</text>
    <text x="66" y="260">/compare</text>
    <text x="66" y="282">/tools  (budget + checklist)</text>
    <text x="66" y="304">/shortlist</text>
    <text x="66" y="326">/scholarships</text>
    <text x="66" y="348">/resources</text>
    <text x="66" y="370">/about</text>
    <text x="66" y="392">/developers</text>
    <text x="66" y="414">/contact</text>
    <text x="66" y="448" font-size="10" fill="#7b8c80">all 'use client' — interactive</text>
    <text x="66" y="464" font-size="10" fill="#7b8c80">state, no server calls</text>
  </g>

  <!-- Components column -->
  <rect x="248" y="160" width="178" height="330" rx="10" fill="#fcfdf7" stroke="#15251f" stroke-width="1.8"/>
  <text x="337" y="184" font-size="13" font-weight="800" fill="#15251f" text-anchor="middle">Components — components/</text>
  <line x1="262" y1="194" x2="412" y2="194" stroke="#c9d6c9" stroke-width="1"/>
  <g font-size="11" fill="#15251f">
    <text x="262" y="218" font-weight="700">SiteProvider</text>
    <text x="262" y="234" font-size="10" fill="#4f645a">theme + language context,</text>
    <text x="262" y="248" font-size="10" fill="#4f645a">EN/BN copy dictionary</text>
    <text x="262" y="278" font-weight="700">SiteHeader</text>
    <text x="262" y="294" font-size="10" fill="#4f645a">brand · nav · theme/lang</text>
    <text x="262" y="308" font-size="10" fill="#4f645a">toggles · mobile menu</text>
    <text x="262" y="338" font-weight="700">SiteFooter</text>
    <text x="262" y="354" font-size="10" fill="#4f645a">links · contact · legal</text>
    <text x="262" y="384" font-weight="700">DestinationCard</text>
    <text x="262" y="400" font-size="10" fill="#4f645a">photo card · flag ·</text>
    <text x="262" y="414" font-size="10" fill="#4f645a">landmark · CTA</text>
    <text x="262" y="448" font-size="10" fill="#7b8c80">shared by home +</text>
    <text x="262" y="464" font-size="10" fill="#7b8c80">/destinations</text>
  </g>

  <!-- Libraries column -->
  <rect x="444" y="160" width="178" height="330" rx="10" fill="#fcfdf7" stroke="#15251f" stroke-width="1.8"/>
  <text x="533" y="184" font-size="13" font-weight="800" fill="#15251f" text-anchor="middle">Libraries — lib/</text>
  <line x1="458" y1="194" x2="608" y2="194" stroke="#c9d6c9" stroke-width="1"/>
  <g font-size="11" fill="#15251f">
    <text x="458" y="218" font-weight="700">data.js</text>
    <text x="458" y="234" font-size="10" fill="#4f645a">COUNTRIES (22) +</text>
    <text x="458" y="248" font-size="10" fill="#4f645a">COUNTRY_PROFILE +</text>
    <text x="458" y="262" font-size="10" fill="#4f645a">SCHOLARSHIPS +</text>
    <text x="458" y="276" font-size="10" fill="#4f645a">DOCUMENTS_BY_LEVEL +</text>
    <text x="458" y="290" font-size="10" fill="#4f645a">DESTINATION_MEDIA</text>
    <text x="458" y="320" font-weight="700">fit.js</text>
    <text x="458" y="336" font-size="10" fill="#4f645a">WEIGHTS (EN 30% ·</text>
    <text x="458" y="350" font-size="10" fill="#4f645a">grade 25% · budget</text>
    <text x="458" y="364" font-size="10" fill="#4f645a">25% · qual 20%)</text>
    <text x="458" y="378" font-size="10" fill="#4f645a">factorScores ·</text>
    <text x="458" y="392" font-size="10" fill="#4f645a">verdictFor ·</text>
    <text x="458" y="406" font-size="10" fill="#4f645a">computeResults ·</text>
    <text x="458" y="420" font-size="10" fill="#4f645a">next steps · alternatives</text>
    <text x="458" y="452" font-size="10" fill="#7b8c80">imported by routes;</text>
    <text x="458" y="466" font-size="10" fill="#7b8c80">pure functions, no I/O</text>
  </g>

  <!-- Intra-app data flow note -->
  <g stroke="#4f645a" stroke-width="1.4" fill="none">
    <path d="M230,330 L246,330" marker-end="url(#arr)"/>
    <path d="M426,330 L442,330" marker-end="url(#arr)"/>
    <path d="M337,490 L337,513" marker-end="url(#arr)"/>
  </g>
  <text x="231" y="322" font-size="9.5" fill="#4f645a">render</text>
  <text x="429" y="322" font-size="9.5" fill="#4f645a">import</text>
  <text x="345" y="505" font-size="9.5" fill="#4f645a">context</text>

  <!-- Browser APIs & storage strip -->
  <rect x="52" y="515" width="570" height="190" rx="10" fill="#fbebc4" stroke="#15251f" stroke-width="1.8"/>
  <text x="66" y="540" font-size="13" font-weight="800" fill="#15251f">Browser APIs &amp; client-side persistence</text>
  <line x1="66" y1="550" x2="608" y2="550" stroke="#e3d9b8" stroke-width="1"/>
  <g font-size="10.5" fill="#15251f">
    <text x="66" y="572" font-weight="700">localStorage keys</text>
    <text x="66" y="588" font-size="10" fill="#4f645a">cyf-assessment-draft · cyf-saved-report · cyf-tool-state ·</text>
    <text x="66" y="603" font-size="10" fill="#4f645a">cyf-compare-state · cyf-shortlist · cyf-theme-v3 · cyf-language</text>
    <text x="66" y="628" font-weight="700">Web APIs used</text>
    <text x="66" y="644" font-size="10" fill="#4f645a">navigator.share / navigator.clipboard (report sharing) · window.print (PDF) ·</text>
    <text x="66" y="659" font-size="10" fill="#4f645a">URL params ?assessment=… &amp; ?country=… (shareable links) · history.replaceState</text>
    <text x="66" y="684" font-size="10" fill="#8b5b00">No cookies · no server session · clearing site data resets everything</text>
  </g>

  <!-- ================= EXTERNAL PANEL ================= -->
  <rect x="680" y="85" width="530" height="640" rx="14" fill="#e7efe4" stroke="#15251f" stroke-width="2"/>
  <rect x="680" y="85" width="530" height="46" rx="14" fill="#2e7d63"/>
  <rect x="680" y="115" width="530" height="16" fill="#2e7d63"/>
  <text x="700" y="114" font-size="15" font-weight="800" fill="#fcfdf7">External services &amp; assets</text>
  <text x="1190" y="114" font-size="11.5" fill="#d7e7dc" text-anchor="end">called from the browser only</text>

  <!-- External boxes -->
  <g>
    <rect x="710" y="160" width="470" height="86" rx="10" fill="#fcfdf7" stroke="#15251f" stroke-width="1.8"/>
    <text x="728" y="186" font-size="13" font-weight="800" fill="#15251f">Google Fonts CDN</text>
    <text x="728" y="206" font-size="11" fill="#4f645a">fonts.googleapis.com / fonts.gstatic.com</text>
    <text x="728" y="224" font-size="10.5" fill="#7b8c80">Bricolage Grotesque · Atkinson Hyperlegible · Anek Bangla</text>
    <text x="728" y="240" font-size="10" fill="#8b5b00">loaded via @import in app/globals.css</text>
  </g>
  <g>
    <rect x="710" y="272" width="470" height="86" rx="10" fill="#fcfdf7" stroke="#15251f" stroke-width="1.8"/>
    <text x="728" y="298" font-size="13" font-weight="800" fill="#15251f">Photography — local /images + Unsplash CDN</text>
    <text x="728" y="318" font-size="11" fill="#4f645a">hero · section · page-hero backgrounds, destination cards</text>
    <text x="728" y="336" font-size="10.5" fill="#7b8c80">public/images/*.jpg first, images.unsplash.com fallback</text>
    <text x="728" y="352" font-size="10" fill="#8b5b00">scripts/download-backgrounds.mjs caches copies locally</text>
  </g>
  <g>
    <rect x="710" y="384" width="470" height="86" rx="10" fill="#fcfdf7" stroke="#15251f" stroke-width="1.8"/>
    <text x="728" y="410" font-size="13" font-weight="800" fill="#15251f">WhatsApp — wa.me/8801773863356</text>
    <text x="728" y="430" font-size="11" fill="#4f645a">"Discuss my result" + "WhatsApp us" buttons</text>
    <text x="728" y="448" font-size="10.5" fill="#7b8c80">target=_blank link with prefilled assessment summary</text>
  </g>
  <g>
    <rect x="710" y="496" width="470" height="86" rx="10" fill="#fcfdf7" stroke="#15251f" stroke-width="1.8"/>
    <text x="728" y="522" font-size="13" font-weight="800" fill="#15251f">Email — mailto:info@flyeducationbd.com</text>
    <text x="728" y="542" font-size="11" fill="#4f645a">"Email report" action on the result card</text>
    <text x="728" y="560" font-size="10.5" fill="#7b8c80">opens the user's mail client with a summary body</text>
  </g>
  <g>
    <rect x="710" y="608" width="470" height="86" rx="10" fill="#fcfdf7" stroke="#15251f" stroke-width="1.8"/>
    <text x="728" y="634" font-size="13" font-weight="800" fill="#15251f">Official sources (outbound links)</text>
    <text x="728" y="654" font-size="11" fill="#4f645a">country.src · scholarship.url · rmstu.ac.bd</text>
    <text x="728" y="672" font-size="10.5" fill="#7b8c80">user verifies requirements on provider sites —</text>
    <text x="728" y="686" font-size="10.5" fill="#7b8c80">the app never fetches or scrapes them</text>
  </g>

  <!-- Arrows client -> external -->
  <g stroke="#15251f" stroke-width="1.6" fill="none">
    <path d="M630,203 L706,203" marker-end="url(#arr)"/>
    <path d="M630,315 L706,315" marker-end="url(#arr)"/>
    <path d="M630,427 L706,427" marker-end="url(#arr)"/>
    <path d="M630,539 L706,539" marker-end="url(#arr)"/>
    <path d="M630,651 L706,651" marker-end="url(#arr)"/>
  </g>
  <g font-size="10" fill="#4f645a">
    <text x="640" y="196">fonts</text>
    <text x="640" y="308">images</text>
    <text x="640" y="420">wa.me</text>
    <text x="640" y="532">mailto</text>
    <text x="640" y="644">links ↗</text>
  </g>

  <!-- ================= DATA / FLOW NOTES ================= -->
  <rect x="30" y="740" width="1180" height="26" rx="6" fill="#fbebc4" stroke="#15251f" stroke-width="1.5"/>
  <text x="620" y="757" font-size="11.5" fill="#4f645a" text-anchor="middle">Request path: browser loads static HTML/JS → React hydrates → user interacts → all reads/writes stay inside the page (static lib/ data + localStorage) → outbound actions open new tabs/windows only</text>
</svg>
