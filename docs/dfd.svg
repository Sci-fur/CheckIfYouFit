<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15251f"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f645a"/>
    </marker>
  </defs>

  <rect width="1240" height="900" fill="#f1f4ec"/>

  <!-- Title -->
  <text x="30" y="34" font-size="22" font-weight="800" fill="#15251f">CheckIfYouFit — Level-1 Data Flow Diagram</text>
  <text x="30" y="56" font-size="13" fill="#4f645a">Fully client-side system: no backend or API routes. All processing, scoring and persistence happen in the browser.</text>

  <!-- ============ EXTERNAL ENTITIES ============ -->
  <!-- E1 Student -->
  <rect x="30" y="395" width="155" height="105" rx="8" fill="#fbebc4" stroke="#15251f" stroke-width="2"/>
  <text x="107" y="425" font-size="14" font-weight="800" fill="#15251f" text-anchor="middle">E1 · Student / User</text>
  <text x="107" y="446" font-size="11.5" fill="#4f645a" text-anchor="middle">provides answers,</text>
  <text x="107" y="462" font-size="11.5" fill="#4f645a" text-anchor="middle">views results, saves</text>
  <text x="107" y="482" font-size="10.5" fill="#7b8c80" text-anchor="middle">reports</text>

  <!-- E2 Official sources -->
  <rect x="1055" y="45" width="165" height="95" rx="8" fill="#fbebc4" stroke="#15251f" stroke-width="2"/>
  <text x="1137" y="72" font-size="13.5" font-weight="800" fill="#15251f" text-anchor="middle">E2 · Official sources</text>
  <text x="1137" y="92" font-size="10.5" fill="#4f645a" text-anchor="middle">universities · governments</text>
  <text x="1137" y="107" font-size="10.5" fill="#4f645a" text-anchor="middle">· scholarship providers</text>
  <text x="1137" y="126" font-size="10" fill="#8b5b00" text-anchor="middle">(outbound links only)</text>

  <!-- E3 WhatsApp / Email -->
  <rect x="1055" y="705" width="165" height="95" rx="8" fill="#fbebc4" stroke="#15251f" stroke-width="2"/>
  <text x="1137" y="732" font-size="13.5" font-weight="800" fill="#15251f" text-anchor="middle">E3 · WhatsApp / Email</text>
  <text x="1137" y="752" font-size="10.5" fill="#4f645a" text-anchor="middle">report sharing via</text>
  <text x="1137" y="767" font-size="10.5" fill="#4f645a" text-anchor="middle">wa.me and mailto:</text>

  <!-- ============ STATIC DATA STORE ============ -->
  <rect x="430" y="40" width="380" height="85" rx="6" fill="#e7efe4" stroke="#15251f" stroke-width="2"/>
  <text x="620" y="66" font-size="13" font-weight="800" fill="#15251f" text-anchor="middle">D0 · Static dataset — lib/data.js  (read-only)</text>
  <text x="620" y="88" font-size="11" fill="#4f645a" text-anchor="middle">COUNTRIES (22) · COUNTRY_PROFILE · SCHOLARSHIPS · DOCUMENTS_BY_LEVEL · DESTINATION_MEDIA</text>
  <line x1="445" y1="98" x2="795" y2="98" stroke="#15251f" stroke-width="1"/>
  <text x="620" y="114" font-size="10" fill="#7b8c80" text-anchor="middle">bundled at build time — no runtime fetch</text>

  <!-- ============ PROCESSES (row 1) ============ -->
  <circle cx="280" cy="400" r="56" fill="#0e4a3c" stroke="#15251f" stroke-width="2"/>
  <text x="280" y="392" font-size="12" font-weight="800" fill="#fcfdf7" text-anchor="middle">P1</text>
  <text x="280" y="410" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Eligibility</text>
  <text x="280" y="426" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Wizard</text>
  <text x="280" y="443" font-size="9.5" fill="#c9dcd0" text-anchor="middle">7 steps · app/page.jsx</text>

  <circle cx="560" cy="400" r="56" fill="#0e4a3c" stroke="#15251f" stroke-width="2"/>
  <text x="560" y="392" font-size="12" font-weight="800" fill="#fcfdf7" text-anchor="middle">P2</text>
  <text x="560" y="410" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Fit Scoring</text>
  <text x="560" y="426" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Engine</text>
  <text x="560" y="443" font-size="9.5" fill="#c9dcd0" text-anchor="middle">lib/fit.js</text>

  <circle cx="840" cy="400" r="56" fill="#0e4a3c" stroke="#15251f" stroke-width="2"/>
  <text x="840" y="392" font-size="12" font-weight="800" fill="#fcfdf7" text-anchor="middle">P5</text>
  <text x="840" y="410" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Directory,</text>
  <text x="840" y="426" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Compare &amp;</text>
  <text x="840" y="442" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Scholarships</text>
  <text x="840" y="459" font-size="9" fill="#c9dcd0" text-anchor="middle">destinations · compare · scholarships · resources</text>

  <!-- ============ PROCESSES (row 2) ============ -->
  <circle cx="280" cy="640" r="56" fill="#0e4a3c" stroke="#15251f" stroke-width="2"/>
  <text x="280" y="632" font-size="12" font-weight="800" fill="#fcfdf7" text-anchor="middle">P3</text>
  <text x="280" y="650" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Cost Estimator</text>
  <text x="280" y="666" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">&amp; Checklist</text>
  <text x="280" y="683" font-size="9.5" fill="#c9dcd0" text-anchor="middle">app/tools/page.jsx</text>

  <circle cx="560" cy="640" r="56" fill="#0e4a3c" stroke="#15251f" stroke-width="2"/>
  <text x="560" y="632" font-size="12" font-weight="800" fill="#fcfdf7" text-anchor="middle">P4</text>
  <text x="560" y="650" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Shortlist</text>
  <text x="560" y="666" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Tracker</text>
  <text x="560" y="683" font-size="9.5" fill="#c9dcd0" text-anchor="middle">app/shortlist/page.jsx</text>

  <circle cx="840" cy="640" r="56" fill="#0e4a3c" stroke="#15251f" stroke-width="2"/>
  <text x="840" y="632" font-size="12" font-weight="800" fill="#fcfdf7" text-anchor="middle">P6</text>
  <text x="840" y="650" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">Report Actions</text>
  <text x="840" y="666" font-size="11.5" font-weight="700" fill="#fcfdf7" text-anchor="middle">(save · print · share)</text>
  <text x="840" y="683" font-size="9.5" fill="#c9dcd0" text-anchor="middle">ResultCard · app/page.jsx</text>

  <!-- ============ DATA STORES (localStorage) ============ -->
  <rect x="40"  y="800" width="185" height="72" rx="5" fill="#cbe5d5" stroke="#15251f" stroke-width="2"/>
  <text x="132" y="824" font-size="12.5" font-weight="800" fill="#15251f" text-anchor="middle">D2 · Tools store</text>
  <text x="132" y="843" font-size="10" fill="#4f645a" text-anchor="middle">cyf-tool-state</text>
  <text x="132" y="858" font-size="9.5" fill="#7b8c80" text-anchor="middle">costs · checklist · level</text>

  <rect x="242" y="800" width="185" height="72" rx="5" fill="#cbe5d5" stroke="#15251f" stroke-width="2"/>
  <text x="334" y="824" font-size="12.5" font-weight="800" fill="#15251f" text-anchor="middle">D3 · Compare store</text>
  <text x="334" y="843" font-size="10" fill="#4f645a" text-anchor="middle">cyf-compare-state</text>
  <text x="334" y="858" font-size="9.5" fill="#7b8c80" text-anchor="middle">countries · cost edits</text>

  <rect x="444" y="800" width="185" height="72" rx="5" fill="#cbe5d5" stroke="#15251f" stroke-width="2"/>
  <text x="536" y="824" font-size="12.5" font-weight="800" fill="#15251f" text-anchor="middle">D4 · Shortlist store</text>
  <text x="536" y="843" font-size="10" fill="#4f645a" text-anchor="middle">cyf-shortlist</text>
  <text x="536" y="858" font-size="9.5" fill="#7b8c80" text-anchor="middle">entries · deadlines · status</text>

  <rect x="646" y="800" width="185" height="72" rx="5" fill="#cbe5d5" stroke="#15251f" stroke-width="2"/>
  <text x="738" y="824" font-size="12.5" font-weight="800" fill="#15251f" text-anchor="middle">D5 · Preferences</text>
  <text x="738" y="843" font-size="10" fill="#4f645a" text-anchor="middle">cyf-theme-v3 · cyf-language</text>
  <text x="738" y="858" font-size="9.5" fill="#7b8c80" text-anchor="middle">theme · language</text>

  <rect x="848" y="800" width="185" height="72" rx="5" fill="#cbe5d5" stroke="#15251f" stroke-width="2"/>
  <text x="940" y="824" font-size="12.5" font-weight="800" fill="#15251f" text-anchor="middle">D1 · Assessment store</text>
  <text x="940" y="843" font-size="10" fill="#4f645a" text-anchor="middle">cyf-assessment-draft</text>
  <text x="940" y="858" font-size="9.5" fill="#7b8c80" text-anchor="middle">cyf-saved-report</text>

  <!-- ============ DATA FLOWS ============ -->
  <g stroke="#15251f" stroke-width="1.6" fill="none">
    <!-- F1 E1 -> P1 -->
    <path d="M185,430 L228,416" marker-end="url(#arr)"/>
    <!-- F2 P1 -> P2 -->
    <path d="M336,395 L504,395" marker-end="url(#arr)"/>
    <!-- F3 D0 -> P2 -->
    <path d="M560,125 L560,342" marker-end="url(#arr)"/>
    <!-- F4 D0 -> P5 -->
    <path d="M810,95 C880,170 855,290 801,361" marker-end="url(#arr)"/>
    <!-- F5 E2 -> P5 (outbound links, dashed) -->
    <path d="M1140,140 C1075,195 1000,280 893,381" stroke-dasharray="7 5" marker-end="url(#arr)"/>
    <!-- F6 P2 -> E1 report (routed above) -->
    <path d="M560,344 L560,310 L145,310 L145,393" marker-end="url(#arr)"/>
    <!-- F7 P1 <-> D1 draft (bidirectional) -->
    <path d="M310,448 C358,502 374,528 368,552 H948 V800" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <!-- F8 P2 -> P6 -->
    <path d="M598,446 C675,508 758,552 814,590" marker-end="url(#arr)"/>
    <!-- F9 P6 -> D1 save report -->
    <path d="M847,697 C862,742 876,772 890,798" marker-end="url(#arr)"/>
    <!-- F10 P6 -> E3 share -->
    <path d="M893,663 L1042,720 L1060,742" marker-end="url(#arr)"/>
    <!-- F11 E1 -> P3 -->
    <path d="M120,502 C150,545 210,568 256,586" marker-end="url(#arr)"/>
    <!-- F12 P3 -> E1 -->
    <path d="M261,661 C220,635 175,580 132,506" marker-end="url(#arr)"/>
    <!-- F13 P3 <-> D2 -->
    <path d="M280,700 C250,742 205,772 168,798" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <!-- F14 E1 -> P4 -->
    <path d="M140,502 L140,730 L540,730 L540,697" marker-end="url(#arr)"/>
    <!-- F15 P4 <-> D4 -->
    <path d="M593,688 C580,742 552,774 528,798" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <!-- F16 E1 -> P5 -->
    <path d="M185,478 H742 V427 H790" marker-end="url(#arr)"/>
    <!-- F17 P5 -> E1 -->
    <path d="M878,444 H915 V580 H170 V504" marker-end="url(#arr)"/>
    <!-- F18 P5 <-> D3 -->
    <path d="M818,452 H705 V768 H330 V800" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <!-- F19 D5 -> P1 preferences (dashed) -->
    <path d="M660,800 V462 H335 V430" stroke="#4f645a" stroke-dasharray="6 5" marker-end="url(#arrS)"/>
  </g>

  <!-- Flow labels -->
  <g font-size="11" fill="#4f645a">
    <text x="188" y="408">7-step answers</text>
    <text x="398" y="382">completed answers</text>
    <text x="572" y="240">profile · weights (read)</text>
    <text x="862" y="215">catalog data (read)</text>
    <text x="958" y="305" transform="rotate(-38 958 305)">official links ↗ (outbound)</text>
    <text x="330" y="296">fit report: score · factors · verdict · alternatives · institutions</text>
    <text x="600" y="512">assessment draft ⇄ restore on load</text>
    <text x="690" y="548">results payload</text>
    <text x="852" y="758">save report</text>
    <text x="952" y="712">share / email</text>
    <text x="128" y="548">tool inputs</text>
    <text x="126" y="628">estimates · checklist progress</text>
    <text x="185" y="762">tool state (read/write)</text>
    <text x="352" y="722">add / update entries</text>
    <text x="560" y="762">tracked list · status</text>
    <text x="420" y="468">search · filter · compare</text>
    <text x="520" y="592">directory · compare · scholarship results</text>
    <text x="452" y="784">compare selections · cost edits</text>
    <text x="352" y="448">theme · language (dashed)</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <rect x="1040" y="815" width="185" height="75" rx="6" fill="#fcfdf7" stroke="#15251f" stroke-width="1.5"/>
  <text x="1052" y="836" font-size="11" font-weight="800" fill="#15251f">Legend</text>
  <circle cx="1062" cy="854" r="9" fill="#0e4a3c" stroke="#15251f" stroke-width="1.5"/>
  <text x="1078" y="858" font-size="10.5" fill="#4f645a">process</text>
  <rect x="1052" y="866" width="18" height="12" rx="2" fill="#fbebc4" stroke="#15251f" stroke-width="1.2"/>
  <text x="1078" y="876" font-size="10.5" fill="#4f645a">entity / store</text>
</svg>
